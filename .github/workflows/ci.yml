name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# 干净机器上的那道闸：本地跑不跑随你，这里是"别人 clone 下来能不能过"的答案。
jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与本地同一条版本线（engines 里写的是 bun >= 1.3.0；bun.lock 锁依赖）
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      # 两个包（terminal / tui）的 tsconfig 都过 —— 类型是这套代码唯一的机器判据
      - name: Typecheck
        run: bun run typecheck

      # `bun test` 全跑：都是无头用例（要真进程的那条自带子进程夹具，不占终端）
      - name: Tests
        run: bun test
