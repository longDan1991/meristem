[project]
name = "humanoid"
version = "0.1.0"
description = "一棵递归工作的 LLM 树"
requires-python = ">=3.11"
dependencies = [
    "litellm",       # LLM 客户端（OpenAI 兼容端点；流式 / 重试 / usage）
    "python-dotenv",  # .env 解析
    "rich",           # 终端渲染 / 颜色 / TTY 检测
    "fastmcp>=4.0.5",
    "prompt-toolkit>=3.0.53",
    "headroom-ai",    # 叶子工具输出的路由压缩（选项 B）：SmartCrusher/LOG/CCR，本地可逆
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

# AGENTS.md §12：纪律由 lint 执行，不靠自觉。
[tool.ruff.lint]
select = ["E402", "PLC0415", "BLE001", "F401", "F841"]
