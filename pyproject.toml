[project]
name = "humanoid"
version = "0.1.0"
description = "一棵递归工作的 LLM 树"
requires-python = ">=3.11"
dependencies = [
    "litellm",        # 模型出口：OpenAI 兼容多端点 + 流式 + 重试
    "json-repair",    # 模型输出里抽/修 JSON
    "python-dotenv",  # .env 解析
    "jieba",          # 中文分词（检索词法）
    "rich",           # 终端渲染 / 颜色 / TTY 检测
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

# AGENTS.md §12：纪律由 lint 执行，不靠自觉。
[tool.ruff.lint]
select = ["E402", "PLC0415", "BLE001", "F401", "F841"]
