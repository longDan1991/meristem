[project]
name = "meristem"
version = "0.1.0"
description = "一棵递归工作的 LLM 树"
requires-python = ">=3.11"
dependencies = [
    "openai",        # LLM 客户端（官方 SDK，OpenAI 兼容端点；流式 / 重试 / usage）
    "python-dotenv",  # .env 解析
    "fastmcp>=4.0.5",  # 工具定义（@mcp.tool：schema + 实现一体）
    "pydantic",       # 工具参数与形式字段的形状
    "pydash>=8.1.0",
    "llmbash>=0.1.0",  # bash 工具引擎：进程内 shell（分发名 llmbash，import 仍是 llm_sh）
    "textual>=8.2.8",  # 终端界面：组件（日志 / 树 / 输入）与布局
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

# AGENTS.md §12：纪律由 lint 执行，不靠自觉。
[tool.ruff.lint]
select = ["E402", "PLC0415", "BLE001", "F401", "F841"]
